<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub 本周热门 · 复古终端风浏览器 —— 日/周/月榜一键同步，本地缓存离线兜底">
  <meta name="theme-color" content="#050b07">
  <title>GH-TRENDING // TERMINAL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050b07'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' fill='%2333ff88'%3E%26gt;_%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- SIDE ART · pixel banners + faint grid, pure decoration (>=1400px only) -->
  <div class="side-grid side-grid-l" aria-hidden="true"></div>
  <div class="side-grid side-grid-r" aria-hidden="true"></div>
  <div class="side-art side-left" aria-hidden="true">
    <span class="saw"><span class="sa">G</span><span class="sa">I</span><span class="sa">T</span><span class="sa">H</span><span class="sa">U</span><span class="sa hi">B</span></span>
  </div>
  <div class="side-art side-right" aria-hidden="true">
    <span class="saw"><span class="sa hi">R</span><span class="sa">A</span><span class="sa">N</span><span class="sa">K</span><span class="sa">I</span><span class="sa">N</span><span class="sa hi">G</span></span>
  </div>
  <main class="term" aria-label="GitHub Trending 终端">
    <!-- B1 · indeterminate sync progress light bar -->
    <div id="sync-progress" aria-hidden="true"></div>

    <!-- fake terminal window titlebar -->
    <header class="titlebar">
      <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
      <span class="tb-title">gh-trending@localhost:3000 &mdash; zsh</span>
      <button id="clear-btn" type="button" class="tbtn" title="清空屏幕">[ CLEAR ]</button>
    </header>

    <!-- scrollback -->
    <div id="messages" class="messages" role="tabpanel" aria-label="榜单内容" aria-live="polite"></div>

    <!-- command bar -->
    <footer class="cmdbar">
      <div class="periods" role="tablist" aria-label="榜单周期">
        <button type="button" class="pbtn" role="tab" aria-controls="messages" data-since="daily">[ DAILY ]</button>
        <button type="button" class="pbtn" role="tab" aria-controls="messages" data-since="weekly" aria-selected="true">[ WEEKLY ]</button>
        <button type="button" class="pbtn" role="tab" aria-controls="messages" data-since="monthly">[ MONTHLY ]</button>
      </div>
      <button id="sync-btn" type="button" class="tbtn accent" title="重新同步（快捷键 R）">[ SYNC ]</button>
    </footer>

    <!-- status line -->
    <footer class="statusbar">
      <span id="status-left">$ READY</span>
      <span id="status-right">GH-TRENDING v2.0</span>
    </footer>
  </main>

  <script src="render.js"></script>
  <!-- demo.js is promo-only: activates on #/demo/... hashes, inert in normal use -->
  <script src="demo.js"></script>
  <script src="app.js"></script>
</body>
</html>
